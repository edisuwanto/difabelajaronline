<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard - Difabelajar</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <img src="assets/logodifabelajar.jpeg" alt="Logo Difabelajar" width="40" height="40" class="me-2 rounded">
        Difabelajar
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" 
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <button class="btn btn-outline-light ms-lg-3" onclick="logout()">Logout</button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Content -->
  <main class="container my-5">
    <div class="card shadow border-0">
      <div class="card-body">
        <h2 class="card-title text-center text-primary mb-4">📘 Digital Marketing</h2>
        <p class="text-muted text-center">Silakan pilih topik di bawah ini untuk mulai belajar.</p>
        <ol id="topicList" class="list-group list-group-numbered mt-4" aria-label="Daftar Topik Digital Marketing">
          <!-- Topik akan dimuat dengan JS -->
        </ol>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white text-center py-3 mt-auto border-top">
    <p class="mb-0 text-muted">&copy; 2025 Difabelajar. Semua Hak Dilindungi.</p>
  </footer>

  <script src="js/dashboard.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
