<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Materi Belum Bisa Diakses - Difabelajar</title>
  <meta name="description" content="Halaman materi Difabelajar yang belum bisa diakses untuk sementara waktu.">
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-light: #f5f9fc;
      --text-light: #1a202c;
      --bg-dark: #1a202c;
      --text-dark: #f5f9fc;
      --primary: #176ca6;
    }
    body {
      background: var(--bg-light);
      color: var(--text-light);
      font-family: 'Open Sans', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 1rem;
      transition: background 0.5s, color 0.5s;
      opacity: 0;
      animation: fadeIn 1s ease-in-out forwards;
    }
    body.dark-mode {
      background: var(--bg-dark);
      color: var(--text-dark);
    }
    @keyframes fadeIn { to { opacity: 1; } }

    .message-box {
      background: #ffffff;
      border-radius: 16px;
      padding: 2rem 2.5rem;
      max-width: 600px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    body.dark-mode .message-box {
      background: #222;
      box-shadow: 0 4px 16px rgba(255,255,255,0.1);
    }

    h1 {
      color: var(--primary);
      margin-bottom: 1rem;
      font-weight: 700;
    }
    p {
      font-size: 1.1rem;
      margin-bottom: 1.5rem;
    }
    .btn-custom {
      padding: 0.75em 1.8em;
      border-radius: 2em;
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      transition: background .3s;
    }
    .btn-custom:hover, .btn-custom:focus {
      background: #114d77;
      text-decoration: underline;
    }
    footer {
      margin-top: 3rem;
      font-size: 0.95rem;
      color: var(--primary);
    }
  </style>
</head>
<body>
  <button class="btn btn-sm btn-outline-primary toggle-mode" style="position:fixed;top:1rem;right:1rem;">🌙 Mode</button>

  <div class="message-box">
    <h1>Materi Belum Bisa Diakses</h1>
    <p>Maaf, halaman materi ini belum bisa diakses oleh peserta.<br>
    Materi ini bisa diakses pada <strong>hari Jumat, 21 November 2025</strong>.<br><br>
    Silakan kembali ke dashboard untuk memilih materi yang sudah tersedia.</p>
    <button onclick="window.location.href='../dashboard.html'" class="btn btn-lg btn-danger px-4">Kembali ke Dashboard</button>
  </div>

  <footer>
    &copy; 2025 Difabelajar. Semua hak cipta dilindungi.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Dark Mode Toggle
    const toggleBtn = document.querySelector('.toggle-mode');
    toggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      toggleBtn.textContent = document.body.classList.contains('dark-mode') ? '☀️ Mode' : '🌙 Mode';
    });
  </script>
</body>
</html>
