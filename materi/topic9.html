<!DOCTYPE html>

<head>

  <!-- CEK LOGIN SEBELUM HALAMAN DITAMPILKAN -->
  <script>
    (function () {
      const loginData = localStorage.getItem('difabelajar_login');
      if (!loginData) {
        window.location.replace('../login.html');
        return;
      }
      try {
        const user = JSON.parse(loginData);
        if (!user.username) throw new Error("Invalid");
      } catch (error) {
        localStorage.removeItem('difabelajar_login');
        window.location.replace('../login.html');
      }
    })();
  </script>
