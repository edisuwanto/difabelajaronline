<!DOCTYPE html> 
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Topik 7 - Digital Marketing | Difabelajar</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    .logo {
      width: 150px;
      border-radius: 12px;
    }
    .link-item {
      display: block;
      margin-bottom: 10px;
      padding: 12px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
      transition: 0.3s;
    }
    .link-item:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="bg-body-secondary">
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-primary navbar-dark shadow-sm">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="../index.html">
        <img src="../assets/logodifabelajar.jpeg" alt="Logo Difabelajar" class="logo me-2" width="50">
        Difabelajar
      </a>
      <button class="btn btn-outline-light" id="darkModeToggle">🌙 Mode Gelap</button>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container d-flex align-items-center justify-content-center" style="min-height: 85vh;">
    <div class="card border-0 shadow-lg text-center p-4 p-md-5" style="max-width: 700px; width: 100%; border-radius: 24px;">
      <div class="mb-4">
        <img src="../assets/logodifabelajar.jpeg" alt="Logo Difabelajar" class="logo mb-3" style="width: 110px;">
        <div class="fs-1">🔒</div>
      </div>

      <h1 class="fw-bold text-primary mb-3">Halaman Belum Dapat Diakses</h1>
      
      <p class="fs-5 text-secondary mb-3">
        Maaf, halaman ini belum dapat diakses sekarang.
      </p>

      <div class="alert alert-warning border-0 shadow-sm rounded-4 mx-auto mb-4" style="max-width: 500px;">
        <strong>Halaman ini bisa diakses pada hari Kamis, 15 Mei 2026.</strong>
      </div>

      <p class="text-muted mb-4">
        Silakan kembali lagi sesuai jadwal akses yang telah ditentukan. Terima kasih atas kesabarannya.
      </p>

      <div class="d-flex justify-content-center">
        <button onclick="window.location.href='../dashboard.html'" class="btn btn-lg btn-danger px-4 rounded-pill shadow-sm">
          Kembali ke Dashboard
        </button>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Dark Mode Toggle
    const toggle = document.getElementById('darkModeToggle');
    const html = document.documentElement;

    toggle.addEventListener('click', () => {
      if (html.getAttribute('data-bs-theme') === 'light') {
        html.setAttribute('data-bs-theme', 'dark');
        toggle.textContent = "☀️ Mode Terang";
      } else {
        html.setAttribute('data-bs-theme', 'light');
        toggle.textContent = "🌙 Mode Gelap";
      }
    });
  </script>
</body>
</html>
