<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Halaman Belum Tersedia | Difabelajar</title>

  <meta name="description" content="Halaman ini belum dapat diakses dan akan tersedia pada 15 Januari 2026." />

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background-color: #f8f9fa;
      color: #212529;
      margin: 0;
      padding: 0;
      line-height: 1.6;
      text-align: center;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    .logo {
      max-width: 160px;
      width: 100%;
      height: auto;
      margin-bottom: 1.5rem;
    }

    .info-box {
      background-color: #ffffff;
      border-left: 6px solid #0d6efd;
      padding: 1.8rem;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.1rem;
      margin-bottom: 1.2rem;
    }

    .btn-dashboard {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.8rem 1.4rem;
      background-color: #0d6efd;
      color: #ffffff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
    }

    .btn-dashboard:focus,
    .btn-dashboard:hover {
      background-color: #0b5ed7;
      outline: 3px solid #000;
      outline-offset: 2px;
    }

    button {
      margin-top: 1.2rem;
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      border-radius: 6px;
      border: none;
      background-color: #198754;
      color: #fff;
      cursor: pointer;
    }

    button:focus {
      outline: 3px solid #000;
      outline-offset: 2px;
    }
  </style>
</head>

<body>
  <main>
    <!-- Logo -->
    <img
      src="../assets/logodifabelajar.jpeg"
      alt="Logo Difabelajar"
      class="logo"
    />

    <section class="info-box" aria-live="polite">
      <h1>Halaman Belum Dapat Diakses</h1>

      <p>Mohon maaf, halaman ini belum bisa diakses.</p>

      <p>
        Halaman ini baru dapat diakses pada 29 Januari 2026
      </p>

      <p>Silakan kembali ke dashboard.</p>

      <a
        href="../dashboard.html"
        class="btn-dashboard"
        aria-label="Kembali ke halaman dashboard Difabelajar"
      >
        Kembali ke Dashboard
      </a>

      <div>
        <button id="toggleMusic" aria-label="Kontrol musik latar">
          🔊 Matikan Musik
        </button>
      </div>
    </section>
  </main>

  <!-- Audio -->
  <audio id="bgMusic" autoplay loop muted>
    <source src="../assets/audio.mp3" type="audio/mpeg" />
  </audio>

  <script>
    const audio = document.getElementById("bgMusic");
    const toggleBtn = document.getElementById("toggleMusic");

    // Aktifkan suara saat interaksi pertama
    const enableSound = () => {
      if (audio.muted) {
        audio.muted = false;
      }
      document.removeEventListener("click", enableSound);
      document.removeEventListener("keydown", enableSound);
    };

    document.addEventListener("click", enableSound);
    document.addEventListener("keydown", enableSound);

    // Tombol kontrol
    toggleBtn.addEventListener("click", () => {
      if (audio.paused) {
        audio.play();
        toggleBtn.textContent = "🔊 Matikan Musik";
      } else {
        audio.pause();
        toggleBtn.textContent = "▶️ Putar Musik";
      }
    });
  </script>
</body>
</html>
