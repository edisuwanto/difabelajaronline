<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login - Difabelajar</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f6faff;
    }
    .login-card {
      max-width: 400px;
      margin: 5% auto;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    .logo {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <!-- Login Card -->
  <div class="card login-card">
    <div class="card-body">
      <div class="text-center mb-4">
        <img src="assets/logodifabelajar.jpeg" alt="Logo Difabelajar" class="logo">
        <h3 class="text-primary">Login Difabelajar</h3>
        <p class="text-muted small">
          Jika Anda belum memiliki akun, silakan hubungi admin Difabelajar.
        </p>
      </div>
      <div id="loginError" class="alert alert-danger d-none" role="alert" aria-live="assertive"></div>

      <form id="loginForm" autocomplete="on">
        <div class="mb-3">
          <label for="username" class="form-label fw-bold">Username</label>
          <input type="text" id="username" name="username" class="form-control" 
            autocomplete="username" required aria-required="true" aria-label="Masukkan username anda">
        </div>
        <div class="mb-3">
          <label for="password" class="form-label fw-bold">Password</label>
          <input type="password" id="password" name="password" class="form-control" 
            autocomplete="current-password" required aria-required="true" aria-label="Masukkan password anda">
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-bold">Login</button>
      </form>

      <div class="text-center mt-3">
        <a href="index.html" class="btn btn-outline-primary btn-sm">
          &larr; Kembali ke Beranda
        </a>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Script Login -->
  <script>
    const users = [];
    for (let i = 1; i <= 25; i++) {
      users.push({ username: "user" + i, password: "difabelajar2025" });
    }

    const loginError = document.getElementById('loginError');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const uname = usernameInput.value.trim();
      const pwd = passwordInput.value.trim();
      const found = users.find(u => u.username === uname && u.password === pwd);

      if (found) {
        localStorage.setItem('difabelajar_login', JSON.stringify({ username: uname }));
        if (!localStorage.getItem('difabelajar_progress_' + uname)) {
          localStorage.setItem('difabelajar_progress_' + uname, JSON.stringify([]));
        }
        window.location.href = "dashboard.html";
      } else {
        loginError.textContent = "❌ Username atau password salah.";
        loginError.classList.remove("d-none");
        loginError.focus();
      }
    });

    usernameInput.addEventListener('input', () => { loginError.classList.add("d-none"); });
    passwordInput.addEventListener('input', () => { loginError.classList.add("d-none"); });
  </script>
</body>
</html>
