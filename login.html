<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login - Difabelajar</title>
  <meta name="description" content="Halaman login peserta pelatihan Difabelajar.">
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #f5f9fc, #e3f2fd);
      font-family: 'Open Sans', Arial, sans-serif;
      color: #1a202c;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      animation: fadeIn 0.8s ease-in-out forwards;
      opacity: 0;
    }
    @keyframes fadeIn { to { opacity: 1; } }

    .login-card {
      max-width: 420px;
      width: 100%;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      padding: 2.5rem 2rem;
      animation: slideUp 0.8s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .logo {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 10px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    h3 {
      color: #176ca6;
      font-weight: 700;
    }

    .btn-primary {
      background: #176ca6;
      border: none;
      font-weight: 600;
      border-radius: 2em;
      padding: 0.75em;
      transition: background 0.3s, transform 0.2s;
    }
    .btn-primary:hover, .btn-primary:focus {
      background: #0f4f7d;
      transform: scale(1.03);
    }

    .btn-outline-primary {
      border-radius: 2em;
      padding: 0.4em 1.2em;
    }

    .alert {
      border-radius: 8px;
      padding: 0.75rem;
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }

    footer {
      text-align: center;
      font-size: 0.9rem;
      color: #176ca6;
      margin-top: 2rem;
    }
  </style>
</head>

<body>
  <main role="main" aria-labelledby="loginTitle">
    <div class="card login-card">
      <div class="card-body text-center">
        <img src="assets/logodifabelajar.jpeg" alt="Logo Difabelajar" class="logo">
        <h3 id="loginTitle" class="mb-2">Login Difabelajar</h3>
        <p class="text-muted small mb-4">
          Silakan login dengan akun peserta Anda.<br>
          Jika belum memiliki akun, hubungi admin Difabelajar.
        </p>

        <div id="loginError" class="alert alert-danger d-none" role="alert" aria-live="assertive"></div>

        <form id="loginForm" autocomplete="on">
          <div class="mb-3 text-start">
            <label for="username" class="form-label fw-bold">Username</label>
            <input type="text" id="username" name="username" class="form-control"
              autocomplete="username" required aria-required="true" aria-label="Masukkan username anda">
          </div>
          <div class="mb-3 text-start">
            <label for="password" class="form-label fw-bold">Password</label>
            <input type="password" id="password" name="password" class="form-control"
              autocomplete="current-password" required aria-required="true" aria-label="Masukkan password anda">
          </div>
          <button type="submit" class="btn btn-primary w-100 fw-bold">Masuk</button>
        </form>

        <div class="text-center mt-3">
          <a href="index.html" class="btn btn-outline-primary btn-sm">&larr; Kembali ke Beranda</a>
        </div>
      </div>
    </div>
    <footer>
      &copy; 2025 Difabelajar. Semua hak cipta dilindungi.
    </footer>
  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Script Login -->
  <script>
    // Membuat akun otomatis
    const users = [];
    for (let i = 1; i <= 40; i++) {
      users.push({ username: "akun" + i, password: "aisdf" });
    }

    const loginError = document.getElementById('loginError');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const uname = usernameInput.value.trim();
      const pwd = passwordInput.value.trim();
      const found = users.find(u => u.username === uname && u.password === pwd);

      if (found) {
        localStorage.setItem('difabelajar_login', JSON.stringify({ username: uname }));
        if (!localStorage.getItem('difabelajar_progress_' + uname)) {
          localStorage.setItem('difabelajar_progress_' + uname, JSON.stringify([]));
        }
        window.location.href = "dashboard.html";
      } else {
        loginError.textContent = "❌ Username atau password salah.";
        loginError.classList.remove("d-none");
        loginError.focus();
      }
    });

    usernameInput.addEventListener('input', () => loginError.classList.add("d-none"));
    passwordInput.addEventListener('input', () => loginError.classList.add("d-none"));

    // 🧩 Anti-cache otomatis: muat ulang script login terbaru
    (function preventCache() {
      const script = document.createElement('script');
      script.src = "login.js?v=" + Date.now(); // ganti "login.js" dengan nama file JS-mu kalau terpisah
      script.defer = true;
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
